services:
  app:
    build:
      context: .
      target: runner
    image: recruitment-management:latest
    container_name: recruitment-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3033"
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-recruitment}:${POSTGRES_PASSWORD:-recruitment_password}@postgres:5432/${POSTGRES_DB:-recruitment}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in your deployment environment}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Recruitment}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ENABLE_USER_CSV_EXPORT: ${ENABLE_USER_CSV_EXPORT:-false}
    ports:
      - "3033:3033"
    volumes:
      - app_storage:/app/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3033/login'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  migrate:
    build:
      context: .
      target: builder
    image: recruitment-management-migrate:latest
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-recruitment}:${POSTGRES_PASSWORD:-recruitment_password}@postgres:5432/${POSTGRES_DB:-recruitment}?schema=public
    command: ["npx", "prisma", "migrate", "deploy"]

  seed:
    build:
      context: .
      target: builder
    image: recruitment-management-migrate:latest
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-recruitment}:${POSTGRES_PASSWORD:-recruitment_password}@postgres:5432/${POSTGRES_DB:-recruitment}?schema=public
    command: ["npx", "prisma", "db", "execute", "--file", "prisma/seed.sql"]

  postgres:
    image: postgres:17-alpine
    container_name: recruitment-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recruitment}
      POSTGRES_USER: ${POSTGRES_USER:-recruitment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recruitment_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recruitment} -d ${POSTGRES_DB:-recruitment}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app_storage:
  postgres_data:
